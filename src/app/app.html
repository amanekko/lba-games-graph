<div class="app-container">
  <header class="glass-panel header">
    <div class="header-content">
      <div class="title-area">
        <h1>Game Flow Visualizer</h1>
        <p class="subtitle">Interactive path mapping</p>
      </div>

      <div class="controls">
        <label class="btn upload-btn">
          <span>Upload JSON</span>
          <input type="file" accept=".json" (change)="onFileSelected($event)" hidden>
        </label>
        <button class="btn btn-secondary" (click)="loadExample()">Load Example</button>
        <button class="btn btn-primary" (click)="exportJson()">Export JSON</button>
      </div>
    </div>

    @if (errorMessage()) {
    <div class="error-msg">
      {{ errorMessage() }}
    </div>
    }
  </header>

  <main class="canvas-container glass-panel">
    <div #networkContainer class="network-wrapper"></div>
  </main>

  @if (isEditModalOpen()) {
    <div class="modal-backdrop" (click)="cancelEdit()">
      <div class="modal-content glass-panel" (click)="$event.stopPropagation()">
        <h2>Edit Node</h2>
        
        <div class="modal-body">
          <div class="input-group">
            <label for="nodeLabel">Label</label>
            <input id="nodeLabel" type="text" [value]="editingNodeLabel()" (input)="updateLabel($event)" class="text-input" placeholder="Enter node label..." />
          </div>

          <div class="input-group">
            <label>Node Type</label>
            <div class="type-selector">
              <button class="type-btn standard" [class.selected]="editingNodeType() === 'standard'" (click)="setNodeType('standard')">Standard</button>
              <button class="type-btn and" [class.selected]="editingNodeType() === 'and'" (click)="setNodeType('and')">AND</button>
              <button class="type-btn or" [class.selected]="editingNodeType() === 'or'" (click)="setNodeType('or')">OR</button>
              <button class="type-btn start" [class.selected]="editingNodeType() === 'start'" (click)="setNodeType('start')">Start</button>
              <button class="type-btn end" [class.selected]="editingNodeType() === 'end'" (click)="setNodeType('end')">End</button>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn btn-secondary" (click)="cancelEdit()">Cancel</button>
          <button class="btn btn-primary" (click)="confirmEdit()">Save Changes</button>
        </div>
      </div>
    </div>
  }
</div>
